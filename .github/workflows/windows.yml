# builds lust.exe on a Windows machine of GitHub and packs it, with the example games, two
# .bat files and the speech recognizer vosk (its dlls), as lust-windows.zip; the russian model
# of vosk is the second zip, lust-voice-ru.zip (unpack it beside lust.exe). nobody needs Rust
# to use the result.
#   a release:   push a tag v0.1.0 (or on github: Actions, Windows build, Run workflow, and
#                type the version in the field "tag"); the zip is then in Releases
#   a test only: Run workflow with the field "tag" empty; the zip is an artifact of that run
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "version for a release, for example v0.1.0 (empty: only a test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build
        shell: bash
        run: cargo build --release --locked

      - name: Tests
        shell: bash
        run: cargo test --release --locked

      - name: Vosk (speech to text, apache 2.0) and its russian model
        shell: bash
        run: |
          curl -sSfL -o vosk.zip https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip
          curl -sSfL -o lust-voice-ru.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          powershell -NoProfile -Command "Expand-Archive vosk.zip -DestinationPath vosk"
          ls -l lust-voice-ru.zip vosk/*

      - name: Pack
        shell: bash
        run: |
          mkdir -p pack/games
          cp target/release/lust.exe pack/
          cp vosk/vosk-win64-0.3.45/*.dll pack/
          cp dist-windows/*.bat pack/
          cp dist-windows/READ-ME.txt pack/
          cp LICENSE-MIT LICENSE-APACHE NOTICE pack/
          cp src/native/FONT-LICENSE.txt pack/FONT-LICENSE.txt
          for g in pong menu solver; do cp -r examples/$g pack/games/$g; done
          rm -rf pack/games/*/.lust
          cd pack
          powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../lust-windows.zip"
          cd ..
          ls -l lust-windows.zip

      - name: Run the packed program once (it must start, answer and hear words)
        shell: bash
        run: |
          cd pack
          ./lust.exe test games/pong
          ./lust.exe test games/menu
          ./lust.exe test games/solver
          powershell -NoProfile -Command "Expand-Archive ../lust-voice-ru.zip -DestinationPath lust-voice-ru"
          ./lust.exe hear ../tools/voice-check.wav | tee heard.txt
          grep -q "игрок" heard.txt
          rm -rf lust-voice-ru heard.txt

      - uses: actions/upload-artifact@v6
        with:
          name: lust-windows
          path: lust-windows.zip

      - uses: actions/upload-artifact@v6
        with:
          name: lust-voice-ru
          path: lust-voice-ru.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" lust-windows.zip lust-voice-ru.zip --title "Lust $TAG" --generate-notes --target "$GITHUB_SHA"
